<script src="app_popup.js"></script>
<script>


// ========================================
// API
// ========================================

const API_URL =
    window.location.origin;

const LOCAL_CART_KEY =
    "oserpCart";



// ========================================
// CART DATA
// ========================================

let cartItems = [];



// ========================================
// LOAD CART
// ========================================

async function loadCart() {

    const cartContainer =
        document.getElementById("cartItems");


    try {

        const response =
            await fetch(
                `${API_URL}/api/cart`,
                {
                    credentials: "include"
                }
            );


        const result =
            await response.json();


        if (
            !response.ok ||
            !result.success
        ) {

            console.error(
                "Failed to load cart.",
                result
            );

            cartContainer.innerHTML = `
                <div class="empty_cart">

                    <h3>
                        Failed to load cart.
                    </h3>

                </div>
            `;

            return;

        }


        cartItems =
            result.items;

        localStorage.setItem(
            LOCAL_CART_KEY,
            JSON.stringify(cartItems)
        );


        cartContainer.innerHTML = "";

        if (cartItems.length === 0) {
            cartContainer.innerHTML = `
                <div class="empty_cart">
                    <h3>
                        Your cart is empty.
                    </h3>
                </div>
            `;
            return;
        }


        // ====================================
        // CREATE ITEMS
        // ====================================

        cartItems.forEach(function(item) {
            createCartItem(item);
        });

    }


    catch (error) {

        console.error(
            "CART LOAD ERROR:",
            error
        );


        try {
            cartItems = JSON.parse(
                localStorage.getItem(LOCAL_CART_KEY) || "[]"
            );
        } catch (storageError) {
            cartItems = [];
        }

        cartContainer.innerHTML = "";

        if (cartItems.length === 0) {
            cartContainer.innerHTML = `
                <div class="empty_cart">
                    <h3>
                        Could not connect to server.
                    </h3>
                </div>
            `;
            return;
        }

        cartItems.forEach(function(item) {
            createCartItem(item);
        });

    }

}



// ========================================
// CREATE CART ITEM
// ========================================

function createCartItem(item) {


    const cartContainer =
        document.getElementById(
            "cartItems"
        );


    // ====================================
    // MAIN CONTAINER
    // ====================================

    const container =
        document.createElement("div");


    container.className =
        "crt_container";


    container.dataset.id =
        item.id;



    // ====================================
    // IMAGE / SELECT
    // ====================================

    const imageContainer =
        document.createElement("div");


    imageContainer.className =
        "temp";


    imageContainer.innerHTML = `

        <img
            src="images/product/img_2.jpg"
            alt=""
        >


        <div
            class="remove_cart"
            data-id="${item.id}"
        >
            Remove Item
        </div>


        <div class="select_cart">

            <input
                type="checkbox"
                class="cart_checkbox"
                id="cart_item_${item.id}"
                data-id="${item.id}"
            >

            <label
                for="cart_item_${item.id}"
            ></label>

        </div>

    `;



    // ====================================
    // TEXT CONTAINER
    // ====================================

    const textContainer =
        document.createElement("div");


    textContainer.className =
        "text_container_cart";



    // ====================================
    // TITLE + PRICE
    // ====================================

    const titleContainer =
        document.createElement("div");


    titleContainer.className =
        "text_top_title";


    titleContainer.innerHTML = `

        <h5>
            ${escapeHTML(item.product)}
        </h5>


        <div class="cart_price">

            ₱${Number(item.price).toFixed(2)}

        </div>

        <div class="cart_quantity" aria-label="Item quantity">
            <button type="button" class="cart_quantity_button" data-action="decrease" data-id="${item.id}">-</button>
            <strong class="cart_quantity_value">${Number(item.quantity) || 1}</strong>
            <button type="button" class="cart_quantity_button" data-action="increase" data-id="${item.id}">+</button>
        </div>

    `;



    // ====================================
    // DESIGN LIST
    // ====================================

    const bottomText =
        document.createElement("div");


    bottomText.className =
        "bottom_text_cart";


    const scrollContainer =
        document.createElement("div");


    scrollContainer.className =
        "cart_scroll";



    // ====================================
    // COVER
    // ====================================

    const coverRow =
        document.createElement("div");


    coverRow.className =
        "cart_text_container";


    coverRow.innerHTML = `

        <h5>
            ${escapeHTML(item.cover)}
        </h5>

        <h5>
            1
        </h5>

    `;


    scrollContainer.appendChild(
        coverRow
    );



    // ====================================
    // DESIGNS
    // ====================================

    Object.entries(
        item.designs
    ).forEach(
        function([design, quantity]) {


            const row =
                document.createElement("div");


            row.className =
                "cart_text_container";


            row.innerHTML = `

                <h5>
                    ${escapeHTML(design)}
                </h5>

                <h5>
                    ${quantity}
                </h5>

            `;


            scrollContainer.appendChild(
                row
            );

        }
    );



    bottomText.appendChild(
        scrollContainer
    );



    // ====================================
    // BUILD
    // ====================================

    textContainer.appendChild(
        titleContainer
    );


    textContainer.appendChild(
        bottomText
    );


    container.appendChild(
        imageContainer
    );


    container.appendChild(
        textContainer
    );


    cartContainer.appendChild(
        container
    );



    // ====================================
    // REMOVE BUTTON
    // ====================================

    const removeButton =
        imageContainer.querySelector(
            ".remove_cart"
        );


    removeButton.addEventListener(
        "click",
        function() {

            removeCartItem(item.id);

        }
    );

    titleContainer.querySelectorAll(".cart_quantity_button").forEach(function(button) {
        button.addEventListener("click", function() {
            const currentQuantity = Number(item.quantity) || 1;
            const change = button.dataset.action === "increase" ? 1 : -1;
            updateCartQuantity(item.id, currentQuantity + change);
        });
    });

}

async function updateCartQuantity(id, quantity) {
    if (quantity < 1 || quantity > 99) {
        return;
    }

    try {
        const response = await fetch(`${API_URL}/api/cart/${id}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ quantity })
        });
        const result = await response.json();
        if (!response.ok || !result.success) {
            showAppPopup(result.message || "Could not update item quantity.");
            return;
        }
        const itemIndex = cartItems.findIndex(function(item) { return Number(item.id) === Number(id); });
        if (itemIndex >= 0) {
            cartItems[itemIndex] = result.item;
        }
        saveLocalQuantity(id, quantity);
        await loadCart();
    } catch (error) {
        saveLocalQuantity(id, quantity);
        await loadCart();
    }
}

function saveLocalQuantity(id, quantity) {
    try {
        const items = JSON.parse(localStorage.getItem(LOCAL_CART_KEY) || "[]");
        items.forEach(function(item) {
            if (Number(item.id) === Number(id)) {
                item.quantity = quantity;
            }
        });
        localStorage.setItem(LOCAL_CART_KEY, JSON.stringify(items));
    } catch (error) {
        localStorage.removeItem(LOCAL_CART_KEY);
    }
}



// ========================================
// REMOVE CART ITEM
// ========================================

async function removeCartItem(id) {


    const confirmed = await showAppPopup(
        "Remove this item from your cart?",
        { confirm: true }
    );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await fetch(
                `${API_URL}/api/cart/${id}`,
                {
                    method: "DELETE",

                    credentials: "include"
                }
            );


        const result =
            await response.json();


        if (
            !response.ok ||
            !result.success
        ) {

            showAppPopup(
                result.message ||
                "Failed to remove item."
            );

            return;

        }


        const remainingLocalItems =
            JSON.parse(localStorage.getItem(LOCAL_CART_KEY) || "[]")
                .filter(function(item) {
                    return Number(item.id) !== Number(id);
                });

        localStorage.setItem(
            LOCAL_CART_KEY,
            JSON.stringify(remainingLocalItems)
        );


        // Reload cart
        await loadCart();

    }


    catch (error) {

        console.error(
            "REMOVE CART ERROR:",
            error
        );


        const localItems =
            JSON.parse(localStorage.getItem(LOCAL_CART_KEY) || "[]");

        const remainingItems =
            localItems.filter(function(item) {
                return Number(item.id) !== Number(id);
            });

        localStorage.setItem(
            LOCAL_CART_KEY,
            JSON.stringify(remainingItems)
        );

        await loadCart();

    }

}



// ========================================
// CHECKOUT
// ========================================

function continueToShipping(selectedIds) {
    const selectedItems =
        cartItems.filter(function(item) {
            return selectedIds.includes(Number(item.id));
        });

    if (selectedItems.length !== selectedIds.length) {
        showAppPopup("The selected cart items could not be found.");
        return;
    }

    const total =
        selectedItems.reduce(function(sum, item) {
            return sum + Number(item.price);
        }, 0);

    sessionStorage.setItem(
        "checkoutCartItemIds",
        JSON.stringify(selectedIds)
    );

    sessionStorage.setItem(
        "checkoutTotal",
        String(Number(total.toFixed(2)))
    );

    window.location.href =
        "shipping_details.html";
}

const checkoutButton =
    document.getElementById(
        "checkoutButton"
    );


checkoutButton.addEventListener(
    "click",
    async function() {


        // ====================================
        // FIND SELECTED ITEMS
        // ====================================

        const selectedCheckboxes =
            document.querySelectorAll(
                ".cart_checkbox:checked"
            );


        const selectedIds =
            Array.from(
                selectedCheckboxes
            ).map(
                function(checkbox) {

                    return Number(
                        checkbox.dataset.id
                    );

                }
            );


        // ====================================
        // NOTHING SELECTED
        // ====================================

        if (selectedIds.length === 0) {

            showAppPopup(
                "Please select at least one item to checkout."
            );

            return;

        }


        // ====================================
        // ASK SERVER TO VALIDATE
        // ====================================

        try {

            checkoutButton.style.pointerEvents =
                "none";


            const response =
                await fetch(
                    `${API_URL}/api/checkout/preview`,
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        credentials: "include",

                        body: JSON.stringify({

                            cartItemIds:
                                selectedIds

                        })

                    }
                );


            const result =
                await response.json();


            // =================================
            // SERVER REJECTED
            // =================================

            if (
                !response.ok ||
                !result.success
            ) {

                continueToShipping(selectedIds);

                return;

            }


            // =================================
            // SAVE CHECKOUT DATA
            // =================================

            sessionStorage.setItem(
                "checkoutCartItemIds",
                JSON.stringify(selectedIds)
            );


            sessionStorage.setItem(
                "checkoutTotal",
                String(result.total)
            );


            // =================================
            // GO TO SHIPPING
            // =================================

            window.location.href =
                "shipping_details.html";

        }


        catch (error) {

            console.error(
                "CHECKOUT ERROR:",
                error
            );


            continueToShipping(selectedIds);

        }


        finally {

            checkoutButton.style.pointerEvents =
                "auto";

        }

    }
);



// ========================================
// ESCAPE HTML
// ========================================

function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value;

    return div.innerHTML;

}



// ========================================
// START
// ========================================

loadCart();


</script>
